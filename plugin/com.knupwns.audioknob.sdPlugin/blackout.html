<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Blackout Screens</title>
  <link rel="stylesheet" href="pi.css" />
</head>

<body>
  <div class="row">
    <div class="label">Mode</div>
    <div class="value choices">
      <label class="choice"><input type="radio" name="mode" value="overlay" /> black overlay</label>
      <label class="choice"><input type="radio" name="mode" value="power" /> displays off</label>
    </div>
  </div>

  <p class="hint">
    <b>Black overlay</b> covers every monitor with a black window and keeps the
    machine awake - press the key again, or any key or click, to dismiss it. Good
    while something keeps playing or streaming.<br /><br />
    <b>Displays off</b> asks Windows to power the panels down; any input wakes
    them.
  </p>

  <script src="pi.js"></script>
  <script>
    const setMode = PI.radios('mode', 'mode', 'overlay');
    PI.ready(function (settings) { setMode(settings.mode); });
  </script>
</body>

</html>
